# データベース接続設定（docker-composeで作ったMySQLに接続）
spring.datasource.url=jdbc:mysql://localhost:3306/tsuginani_db?useSSL=false&serverTimezone=Asia/Tokyo
spring.datasource.username=tsuginani_user
spring.datasource.password=tsuginani_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
  
  # JPA / Hibernate設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
  
  # サーバーのポート番号（デフォルトのままでOK）
server.port=8080