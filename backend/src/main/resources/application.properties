spring.application.name=backend
# データベース接続設定（docker-composeで作ったMySQLに接続）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tsuginani_db?useSSL=false&serverTimezone=Asia/Tokyo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tsuginani_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tsuginani_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# サーバーのポート番号
server.port=${PORT:8080}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# JWT設定
jwt.secret=tsuginaniAppSecretKeyForJwtTokenGeneration2026SuperSecret
jwt.expiration=86400000
