spring.application.name=backend
# データベース接続設定（docker-composeで作ったMySQLに接続）
spring.datasource.url=jdbc:mysql://localhost:3306/tsuginani_db?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
spring.datasource.username=tsuginani_user
spring.datasource.password=tsuginani_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# サーバーのポート番号
server.port=8080
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
